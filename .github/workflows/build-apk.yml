name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Flutter release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --platforms=android --org ai.opencode --project-name opencode .

      - name: Patch AndroidManifest (INTERNET + local HTTP for Ollama)
        run: |
          f=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' "$f"; then
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET" />\n    <application#' "$f"
          fi
          if ! grep -q 'usesCleartextTraffic' "$f"; then
            sed -i 's#<application#<application\n        android:usesCleartextTraffic="true"#' "$f"
          fi
          echo '--- AndroidManifest.xml ---'
          cat "$f"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (non blocking)
        continue-on-error: true
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
